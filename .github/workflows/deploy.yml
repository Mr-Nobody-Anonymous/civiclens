# ============================================================================
# CivicLens Ethiopia — build & publish Docker images + optional auto-deploy
#
# On every push to main (after CI) this workflow:
#   1. builds the API+SPA image and the AI-service image
#   2. pushes them to GitHub Container Registry (ghcr.io/<owner>/<repo>)
#   3. optionally triggers a deploy on your platform of choice
#
# Any server can then run the platform with nothing but Docker:
#   docker pull ghcr.io/OWNER/REPO:latest
#   docker pull ghcr.io/OWNER/REPO-ai:latest
#   (see DEPLOYMENT.md §2 for the compose file that wires them together)
#
# Optional auto-deploy secrets (set the ones you use; the rest are skipped):
#   RENDER_DEPLOY_HOOK_URL   Render:   Settings -> Deploy Hook
#   RAILWAY_TOKEN            Railway:  project token (railway up)
#   FLY_API_TOKEN            Fly.io:   fly tokens create deploy
#   VERCEL_DEPLOY_HOOK_URL   Vercel:   Project -> Settings -> Git -> Deploy Hooks
# ============================================================================
name: Publish & Deploy

on:
  workflow_run:
    workflows: ["CivicLens CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push API + frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image metadata (AI service)
        id: meta_ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-ai
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: ${{ steps.meta_ai.outputs.tags }}
          labels: ${{ steps.meta_ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- optional platform deploys (each step is skipped unless its secret exists) ----
  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        if: ${{ vars.RENDER_ENABLED == 'true' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy (frontend)
        if: ${{ vars.VERCEL_ENABLED == 'true' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - uses: actions/checkout@v4
        if: ${{ vars.FLY_ENABLED == 'true' }}
      - name: Deploy to Fly.io
        if: ${{ vars.FLY_ENABLED == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy
        if: ${{ vars.FLY_ENABLED == 'true' }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
