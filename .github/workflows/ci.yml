name: CivicLens CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: civiclens_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install python deps
        run: |
          pip install -r backend/requirements.txt "psycopg[binary]" ruff
          pip install -r ai-service/requirements.txt faster-whisper
      - name: Lint (ruff)
        run: ruff check backend/app ai-service --select E9,F63,F7,F82,F401,F811
      - name: Migration test — SQLite clean chain
        working-directory: backend
        run: CL_DATABASE_URL=sqlite:////tmp/ci.db python -m alembic upgrade head
      - name: Migration test — PostgreSQL clean chain + downgrade/upgrade
        working-directory: backend
        env:
          CL_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/civiclens_ci
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Backend tests (SQLite + shared-Redis rate limiting)
        working-directory: backend
        run: python -m pytest tests -q
      - name: AI tests + accuracy evaluation harness
        working-directory: ai-service
        run: |
          python -m pytest test_ai.py -q
          python eval_harness.py --check   # fails CI if accuracy drops below baseline

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Production build
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependency vulnerability scan (pip-audit) + SBOM
        run: |
          pip install pip-audit cyclonedx-bom
          pip-audit -r backend/requirements.txt --strict || true   # report; block on criticals via policy
          pip install -r backend/requirements.txt -q
          cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system & python deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r backend/requirements.txt -r ai-service/requirements.txt faster-whisper
      - name: Install frontend & Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start services and run Playwright tests
        working-directory: frontend
        env:
          CL_RATE_LIMIT_AUTH_PER_MINUTE: "500"
          E2E_BASE_URL: "http://localhost:5173"
        run: |
          # 1. Setup backend DB and seed data
          cd ../backend
          python -m alembic upgrade head
          python seed.py
          # 2. Launch backend API server in background
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          # 3. Launch AI service in background
          cd ../ai-service
          nohup python main.py > /tmp/ai.log 2>&1 &
          # 4. Launch frontend dev server in background
          cd ../frontend
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          # 5. Wait for services to be ready
          echo "Waiting for services to become ready..."
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; do sleep 1; done' || (echo "Backend failed to start. Logs:" && cat /tmp/backend.log && exit 1)
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8090/health > /dev/null 2>&1; do sleep 1; done' || (echo "AI service failed to start. Logs:" && cat /tmp/ai.log && exit 1)
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:5173 > /dev/null 2>&1; do sleep 1; done' || (echo "Frontend failed to start. Logs:" && cat /tmp/frontend.log && exit 1)
          echo "All services healthy. Running Playwright..."
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
