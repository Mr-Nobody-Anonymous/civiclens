# ============================================================================
# CivicLens — monitoring overlay: Prometheus (+ alert rules) & Grafana with
# a pre-provisioned CivicLens dashboard.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Grafana:    http://localhost:3001   (admin / value of GRAFANA_PASSWORD)
# Prometheus: http://localhost:9090
#
# NOTE: /api/metrics is public inside the compose network only — keep it
# blocked at your public reverse proxy (see deploy/nginx.conf.example).
# ============================================================================
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-civiclens-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]

volumes:
  promdata:
  grafanadata:
