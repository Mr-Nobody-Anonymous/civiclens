# Prometheus scrape config for CivicLens.
# Used by docker-compose.monitoring.yml; adapt targets for your deployment.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: civiclens-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]        # compose service; replace with real host:port
        labels:
          service: civiclens
